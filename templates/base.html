<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('app_title') }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/home"><b>КВМ</b><small>мониторинг скважин</small></a>
  <nav>
    <a href="/home" class="{{ 'active' if request.url.path == '/home' }}">{{ t('dashboard') }}</a>
    <a href="/wells" class="{{ 'active' if request.url.path.startswith('/wells') }}">{{ t('wells') }}</a>
    <a href="/map" class="{{ 'active' if request.url.path == '/map' }}">{{ t('map') }}</a>
    <a href="/radio" class="{{ 'active' if request.url.path == '/radio' }}">{{ t('radio') }}</a>
    <a href="/reports" class="{{ 'active' if request.url.path.startswith('/reports') }}">{{ t('reports') }}</a>
    <a href="/admin" class="{{ 'active' if request.url.path.startswith('/admin') }}">{{ t('admin') }}</a>
  </nav>
  <div class="right">
    <span class="langs">
      {% for l in languages %}<a href="/lang/{{ l }}" class="{{ 'active' if l == lang }}">{{ l|upper }}</a>{% endfor %}
    </span>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// Числа КПЭ «набегают» при загрузке — редакционный счётчик
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ease = t => 1 - Math.pow(1 - t, 4);
  document.querySelectorAll('.kpi .value, .hero .display').forEach(el => {
    for (const node of el.childNodes) {
      if (node.nodeType !== Node.TEXT_NODE) continue;
      const m = node.textContent.match(/\d[\d\s]*/);
      if (!m) continue;
      const target = parseInt(m[0].replace(/\s/g, ''), 10);
      if (!Number.isFinite(target) || target === 0) continue;
      const tpl = node.textContent;
      const t0 = performance.now(), dur = 1100;
      (function tick(now) {
        const p = Math.min((now - t0) / dur, 1);
        node.textContent = tpl.replace(/\d[\d\s]*/,
          Math.round(target * ease(p)).toString());
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
      break;
    }
  });
})();
</script>
</body>
</html>
