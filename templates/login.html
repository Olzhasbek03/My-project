{% extends "base.html" %}
{% block content %}
<div class="login-box">
  <h1>Optiwell</h1>
  <p class="muted">{{ t('app_title') }}</p>
  {% if error %}<p class="error">{{ t('invalid_credentials') }}</p>{% endif %}
  <form method="post" action="/login">
    <label>{{ t('username') }}<input name="username" required autofocus></label>
    <label>{{ t('password') }}<input name="password" type="password" required></label>
    <button type="submit">{{ t('login') }}</button>
  </form>
</div>
{% endblock %}
